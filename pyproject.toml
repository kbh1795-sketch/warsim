[project]
name = "warsim"
version = "0.1.0"
description = "Self-play combat simulation on an operational-level hex map"
authors = [
    {name = "Byunghee Kim",email = "byunghee.kim@student.uts.edu.au"}
]
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "cymatplotlib @ git+https://code.research.uts.edu.au/cyoolib/cymatplotlib.git",
    "ipython (==8)",
    "numpy",
    "torch"
]

[tool.poetry]
packages = [{include = "warsim"}]

[tool.poetry.dependencies]
torch = {source = "pytorch-cpu"}

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
pytest = "*"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
